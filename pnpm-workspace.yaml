packages:
  - 'apps/*'
  - 'packages/*'
  # Legacy code is reference only and is never part of the workspace.
  - '!BackEnd'
  - '!FrontEnd'

# pnpm 10 does not run dependency lifecycle scripts unless allowed here.
onlyBuiltDependencies:
  - esbuild

# Supply-chain guard: do not install versions published less than one day ago (minutes).
minimumReleaseAge: 1440

# Install scripts we have reviewed and deliberately skip (prebuilt binaries ship as optional deps).
ignoredBuiltDependencies:
  - cpu-features
  - lefthook
  - protobufjs
  - ssh2
  - unrs-resolver

# eslint-plugin-jsx-a11y declares peer support up to ESLint 9; verified working on ESLint 10.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'
