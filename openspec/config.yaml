schema: spec-driven

context: |
  Project: consultorio (working name; rewrite of the Centro Medico Aillu app; engram project: appmedicocmaillu) - medical practice management app.
  Current code is LEGACY and will be REWRITTEN on a new foundation (domain knowledge + UI design reused)
  to become a professional multi-specialty health practice SaaS. Target stack: NOT decided yet (decide in sdd-design).
  Legacy BackEnd: Node, Express 5, mysql2 (raw SQL), JWT issued but never verified, bcrypt/bcryptjs, exceljs, multer. Plain JS (CommonJS-style scripts), no tests/lint/CI.
  Legacy FrontEnd: React 18, Vite 4, Tailwind 3, shadcn/ui (Radix), react-router-dom 7, plain JS (JSX), jsPDF/xlsx exports. No tests/lint.
  Legacy domains: auth, pacientes, profesionales, turnos, horarios, atencion, historias clinicas, asistencias, facturacion, recetas.
  Repo hygiene issues: no .gitignore; node_modules (~18k files) and BackEnd/.env are tracked in git.
  Testing: none today (strict_tdd false); refresh sdd-init once the rewrite introduces a test runner.

strict_tdd: false

testing:
  runner: none
  layers:
    unit: false
    integration: false
    e2e: false
  coverage: false
  quality:
    linter: false
    type_checker: false
    formatter: false
  note: "No test runner, linter, type checker or formatter in legacy code. Re-run sdd-init after the rewrite adds tooling."

rules:
  proposal:
    - Include rollback plan for risky changes
    - Treat the legacy app (separate archived repo francocor/AppmedicoCMAillu) as reference (domain knowledge, UI design), not as code to extend
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Cover health-data privacy, authentication/authorization and multi-tenant/multi-specialty concerns explicitly
  design:
    - Choose the target stack here (not decided yet) and document the decision with rationale and tradeoffs
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Include a Review Workload Forecast (400-line budget); delivery_strategy is ask-on-risk
  apply:
    - Follow patterns defined in the design phase for the new foundation
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
