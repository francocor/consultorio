schema: spec-driven

context: |
  Project: consultorio (working name; rewrite of the Centro Medico Aillu app; engram project: appmedicocmaillu) - medical practice management app.
  The legacy app is REFERENCE ONLY (domain knowledge + UI design). It is not in this repo: it lives in the separate archived repo francocor/AppmedicoCMAillu.
  The rewrite is a professional multi-specialty health practice SaaS. Stack decided in design: TypeScript pnpm monorepo
  (Node 24, Fastify, PostgreSQL 17 + Drizzle + RLS, pg-boss, React 19 + Vite + Tailwind 4 PWA), packages apps/api, apps/web,
  packages/contracts, packages/config, infra/.
  Legacy BackEnd: Node, Express 5, mysql2 (raw SQL), JWT issued but never verified, plain JS, no tests/lint/CI.
  Legacy FrontEnd: React 18, Vite 4, Tailwind 3, shadcn/ui (Radix), plain JS (JSX), no tests/lint.
  Repo hygiene (Stage 0, done): .gitignore added. This repo was created clean (no legacy code, node_modules or committed .env), so the old secrets are not in its history; the owner must still rotate them.
  Testing (refreshed after Stage 0): Vitest (unit, jsdom for web), Testcontainers Postgres 17 (integration), Playwright + axe (e2e), v8 coverage without threshold.
  Quality: ESLint (typescript-eslint strictTypeChecked), tsc --noEmit, Prettier. CI in GitHub Actions; gitleaks pre-commit and in CI.

# Turns on for Stage 1 onward (domain and security code is test-first). Stage 0 was delivered in standard mode.
strict_tdd: true

testing:
  runner: vitest
  # Run from the repo root. Unit: pnpm test. Integration (needs Docker): pnpm test:integration. E2E: pnpm test:e2e.
  test_command: pnpm test
  layers:
    unit: true
    integration: true
    e2e: true
  coverage: true
  coverage_command: pnpm test:coverage
  quality:
    linter: true
    type_checker: true
    formatter: true
  commands:
    linter: pnpm lint
    type_checker: pnpm typecheck
    formatter: pnpm format:check
  note: "Vitest 5 with projects (api and contracts in Node, web in jsdom); integration and e2e need Docker and a Playwright Chromium."

rules:
  proposal:
    - Include rollback plan for risky changes
    - Treat the legacy app (separate archived repo francocor/AppmedicoCMAillu) as reference (domain knowledge, UI design), not as code to extend
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Cover health-data privacy, authentication/authorization and multi-tenant/multi-specialty concerns explicitly
  design:
    - The target stack is decided (see design.md ADRs); record any change to it as a new ADR with rationale and tradeoffs
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Include a Review Workload Forecast (400-line budget); delivery_strategy is ask-on-risk
  apply:
    - Follow patterns defined in the design phase for the new foundation
    tdd: true
    test_command: pnpm test
  verify:
    test_command: pnpm test
    build_command: pnpm build
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
