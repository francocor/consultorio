# ====================================================================================================
#  DEVELOPMENT ONLY. DO NOT DEPLOY THIS FILE. DO NOT POINT IT AT REAL DATA.
#
#  Every credential in it is a public throwaway default (postgres_dev_only, minio_dev_only_secret,
#  app_rw_dev_only, ...), the key-encryption key of the `api` service is the public development
#  placeholder, and MinIO and Mailpit have no authentication worth the name. Anyone who has read this
#  repository knows all of them. The application refuses to start in production with the local key
#  (KMS_PROVIDER=local) and with insecure cookies, which is the safety net, not a licence to reuse
#  these values: production roles, secrets and keys come from the infrastructure (AWS KMS, a secrets
#  store), never from here.
# ====================================================================================================
#
# Local development services. Run from the repository root with the root .env as the interpolation
# source (compose reads .env from the compose file's folder by default, which is infra/):
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
# or use the shortcuts: pnpm infra:up, pnpm infra:down, pnpm infra:reset.
#
# Every published port is bound to 127.0.0.1, so nothing is reachable from the network.
# Nothing in this file is used in production.

name: consultorio

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-consultorio}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the app_owner and app_rw roles on first start (see the file for details).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO stopped publishing community images to Docker Hub and Quay in late 2025, so local
    # development uses the last frozen Bitnami build. It is not maintained: development only.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_only_secret}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: creates the private bucket the application will use, then exits.
  minio-init:
    # The server image also ships the mc client.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_only_secret}
      S3_BUCKET: ${S3_BUCKET:-consultorio-files}
    entrypoint:
      - /bin/sh
      - -c
      - |
        # The Bitnami entrypoint starts MinIO, stops it and starts it again, so the first
        # health check can pass just before a restart. Retry the whole chain (alias, bucket,
        # private policy) for about 60 seconds and fail the job if it never succeeds.
        # Shell variables use $$ so Compose does not interpolate them from its own environment.
        for attempt in $$(seq 1 30); do
          if mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
            mc mb --ignore-existing "local/$$S3_BUCKET" &&
            mc anonymous set none "local/$$S3_BUCKET"; then
            exit 0
          fi
          echo "MinIO is not ready (attempt $$attempt of 30), retrying in 2 seconds" >&2
          sleep 2
        done
        echo "MinIO bucket bootstrap failed after 60 seconds" >&2
        exit 1
    restart: 'no'

  # One-shot job (Stage 6, retention archive): creates the WRITE-ONCE bucket of the archive of cancelled
  # organizations and the two identities that touch it. The bucket is created with Object Lock
  # (versioned, governance mode, a default retention of ARCHIVE_RETENTION_DAYS); `archive-writer` is the
  # credential of the API, the worker and the releaser (it writes, reads and lists, and cannot delete an
  # object or a version, bypass a retention or change the lock of the bucket) and `legal-erasure` is the
  # only identity that may bypass governance, used by `pnpm archive:legal-erase` and nothing else. The
  # policies are the ones of apps/api/src/adapters/archive-local/policies.ts (a test keeps them equal).
  archive-init:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_only_secret}
      ARCHIVE_S3_BUCKET: ${ARCHIVE_S3_BUCKET:-consultorio-archive}
      ARCHIVE_RETENTION_DAYS: ${ARCHIVE_RETENTION_DAYS:-3650}
      ARCHIVE_WRITER_SECRET: ${ARCHIVE_S3_SECRET_ACCESS_KEY:-archive_writer_dev_only_secret}
      ARCHIVE_ERASURE_SECRET: ${ARCHIVE_LEGAL_ERASURE_SECRET_ACCESS_KEY:-legal_erasure_dev_only_secret}
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Same retry as the bucket job above: the image restarts MinIO once while it starts.
        for attempt in $$(seq 1 30); do
          if mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
            mc mb --ignore-existing --with-lock "local/$$ARCHIVE_S3_BUCKET" &&
            mc retention set --default GOVERNANCE "$${ARCHIVE_RETENTION_DAYS}d" "local/$$ARCHIVE_S3_BUCKET" &&
            mc admin policy create local archive-writer /tmp/archive-writer.json &&
            mc admin policy create local legal-erasure /tmp/legal-erasure.json &&
            mc admin user add local archive-writer "$$ARCHIVE_WRITER_SECRET" &&
            mc admin user add local legal-erasure "$$ARCHIVE_ERASURE_SECRET" &&
            mc admin policy attach local archive-writer --user archive-writer &&
            mc admin policy attach local legal-erasure --user legal-erasure; then
            exit 0
          fi
          echo "MinIO is not ready (attempt $$attempt of 30), retrying in 2 seconds" >&2
          sleep 2
        done
        echo "MinIO archive bootstrap failed after 60 seconds" >&2
        exit 1
    # The policy files are written before the entrypoint runs the chain above.
    configs:
      - source: archive-writer-policy
        target: /tmp/archive-writer.json
      - source: legal-erasure-policy
        target: /tmp/legal-erasure.json
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  # Antivirus scanner for uploaded documents. Needs roughly 1 GB of RAM and a minute or two to
  # download signatures on first start. Start it only when working on uploads:
  #   docker compose --env-file .env -f infra/docker-compose.yml --profile scan up -d clamav
  clamav:
    image: clamav/clamav:1.5.4-debian
    profiles: ['scan']
    ports:
      - '127.0.0.1:${CLAMAV_PORT:-3310}:3310'
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD', '/usr/local/bin/clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # The application image, for checking the production build locally:
  #   docker compose --env-file .env -f infra/docker-compose.yml --profile app up --build
  api:
    profiles: ['app']
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ['api']
    environment:
      # "development" on purpose: production refuses the local key-encryption key and insecure
      # cookies, and this stack has no AWS KMS. The image itself is the production build.
      NODE_ENV: development
      DATABASE_URL: postgres://app_rw:app_rw_dev_only@postgres:5432/${POSTGRES_DB:-consultorio}
      # The operator console login (app_operator). Ignored in single mode.
      OPERATOR_DATABASE_URL: postgres://app_operator:app_operator_dev_only@postgres:5432/${POSTGRES_DB:-consultorio}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-multi}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      PLATFORM_HOST: ${PLATFORM_HOST:-platform.localhost}
      SINGLE_TENANT_SLUG: ${SINGLE_TENANT_SLUG:-}
      # Single mode only: the origin that emailed links point at.
      PUBLIC_URL: ${PUBLIC_URL:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      S3_BUCKET: ${S3_BUCKET:-consultorio-files}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio_dev}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_dev_only_secret}
      KMS_PROVIDER: local
      KMS_LOCAL_KEK_BASE64: ${KMS_LOCAL_KEK_BASE64:-ZGV2X29ubHlfbG9jYWxfa2VrXzAxMjM0NTY3ODlhYmM=}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      # The bucket job runs once and exits. Depending on its completion lets
      # "up --wait" treat that exit as success instead of as a failed container.
      minio-init:
        condition: service_completed_successfully

  # The releaser (Stage 6, retention archive): the one process that holds ARCHIVE_RELEASER_KEK and can
  # therefore open the archive. It runs only the job `archive.release`, for a request an operator
  # approved, and never serves HTTP. The key below is a public development value like every other in
  # this file; the API and the worker are given only its public half (ARCHIVE_RELEASER_PUBLIC_KEY).
  #   docker compose --env-file .env -f infra/docker-compose.yml --profile app up --build releaser
  releaser:
    profiles: ['app']
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ['releaser']
    healthcheck:
      disable: true
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://app_rw:app_rw_dev_only@postgres:5432/${POSTGRES_DB:-consultorio}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-multi}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      PLATFORM_HOST: ${PLATFORM_HOST:-platform.localhost}
      SINGLE_TENANT_SLUG: ${SINGLE_TENANT_SLUG:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      S3_BUCKET: ${S3_BUCKET:-consultorio-files}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio_dev}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_dev_only_secret}
      ARCHIVE_S3_BUCKET: ${ARCHIVE_S3_BUCKET:-consultorio-archive}
      ARCHIVE_S3_ENDPOINT: http://minio:9000
      ARCHIVE_S3_ACCESS_KEY_ID: archive-writer
      ARCHIVE_S3_SECRET_ACCESS_KEY: ${ARCHIVE_S3_SECRET_ACCESS_KEY:-archive_writer_dev_only_secret}
      ARCHIVE_RELEASER_KEK: ${ARCHIVE_RELEASER_KEK:-ZGV2X29ubHlfYXJjaGl2ZV9yZWxlYXNlcl9rZWtfMDA=}
      KMS_PROVIDER: local
      KMS_LOCAL_KEK_BASE64: ${KMS_LOCAL_KEK_BASE64:-ZGV2X29ubHlfbG9jYWxfa2VrXzAxMjM0NTY3ODlhYmM=}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      archive-init:
        condition: service_completed_successfully

configs:
  archive-writer-policy:
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "s3:PutObject",
              "s3:GetObject",
              "s3:GetObjectRetention",
              "s3:PutObjectRetention",
              "s3:ListBucket",
              "s3:GetBucketObjectLockConfiguration",
              "s3:GetBucketVersioning"
            ],
            "Resource": [
              "arn:aws:s3:::${ARCHIVE_S3_BUCKET:-consultorio-archive}",
              "arn:aws:s3:::${ARCHIVE_S3_BUCKET:-consultorio-archive}/*"
            ]
          },
          {
            "Effect": "Deny",
            "Action": [
              "s3:DeleteObject",
              "s3:DeleteObjectVersion",
              "s3:BypassGovernanceRetention",
              "s3:PutBucketObjectLockConfiguration",
              "s3:PutBucketVersioning",
              "s3:DeleteBucket"
            ],
            "Resource": [
              "arn:aws:s3:::${ARCHIVE_S3_BUCKET:-consultorio-archive}",
              "arn:aws:s3:::${ARCHIVE_S3_BUCKET:-consultorio-archive}/*"
            ]
          }
        ]
      }
  legal-erasure-policy:
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "s3:GetObject",
              "s3:ListBucket",
              "s3:ListBucketVersions",
              "s3:DeleteObject",
              "s3:DeleteObjectVersion",
              "s3:BypassGovernanceRetention"
            ],
            "Resource": [
              "arn:aws:s3:::${ARCHIVE_S3_BUCKET:-consultorio-archive}",
              "arn:aws:s3:::${ARCHIVE_S3_BUCKET:-consultorio-archive}/*"
            ]
          }
        ]
      }

volumes:
  postgres-data:
  minio-data:
  clamav-data:
