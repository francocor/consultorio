# Prometheus of the local `observability` profile (DEVELOPMENT ONLY: the token below is a public
# throwaway value, like every credential of docker-compose.yml). It scrapes the /metrics port of the API
# and of the worker, and loads the alert rules of the platform from ../alerts.
#
#   docker compose --env-file .env -f infra/docker-compose.yml --profile app --profile observability up
#
# The API of the compose file exposes its port inside the network (api:9464). The worker is not part of
# the compose file; run it on the machine with METRICS_PORT=9465 METRICS_HOST=0.0.0.0
# METRICS_TOKEN=metrics_token_dev_only_0123456789 and the container reaches it through the host.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/rules.yml

scrape_configs:
  - job_name: consultorio-api
    authorization:
      type: Bearer
      credentials: metrics_token_dev_only_0123456789
    static_configs:
      - targets: ['api:9464']
  - job_name: consultorio-worker
    authorization:
      type: Bearer
      credentials: metrics_token_dev_only_0123456789
    static_configs:
      - targets: ['host.docker.internal:9465']
