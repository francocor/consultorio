name: Set up workspace
description: Install Node (from .nvmrc), pnpm (from package.json packageManager) and the locked dependencies.

runs:
  using: composite
  steps:
    # No "version" input: pnpm/action-setup reads packageManager, the single source of truth.
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
