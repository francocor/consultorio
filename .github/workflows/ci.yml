name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the repository unless they say otherwise.
permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      # Fails when the Drizzle schema and the migration files disagree.
      - run: pnpm db:check

  integration:
    name: Integration tests (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace
      # Testcontainers starts Postgres through the Docker daemon of the runner.
      - run: pnpm test:integration

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build
        run: docker build -f infra/Dockerfile -t consultorio-api:ci .
      - name: Smoke test /health
        run: |
          # The image runs with NODE_ENV=production, so this uses the production configuration:
          # AWS KMS and SMTP settings (nothing contacts them at startup) and the multi-tenant domains.
          docker run -d --name api -p 3000:3000 \
            -e DATABASE_URL=postgres://unused:unused@127.0.0.1:1/unused \
            -e DEPLOYMENT_MODE=multi \
            -e BASE_DOMAIN=smoke.test \
            -e PLATFORM_HOST=platform.smoke.test \
            -e KMS_PROVIDER=aws \
            -e AWS_REGION=sa-east-1 \
            -e AWS_KMS_KEY_ID=alias/smoke-test \
            -e SMTP_HOST=smtp.smoke.test \
            -e SMTP_SECURITY=starttls \
            -e ADDRESS_HASH_PEPPER=smoke-test-pepper-0123456789-abcdefghij \
            consultorio-api:ci api
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @consultorio/web exec playwright install --with-deps chromium
      # Starts the whole stack with Docker (Postgres, Mailpit, API, worker) and runs the browser suite.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  lighthouse:
    name: Performance budget (Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @consultorio/web build
      # lighthouserc.json: mobile, 4G with a 4x slower CPU. The job fails when LCP is over 2.5 s,
      # performance is under 0.85, accessibility is under 0.95 or the layout shifts too much.
      - run: pnpm exec lhci autorun

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace
      # Production dependencies only: development tooling does not ship.
      - run: pnpm audit --prod --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Scans every commit of the PR, not just the tip.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only when the repository belongs to a GitHub organization (free for personal
          # accounts). Add it as a repository secret; it is empty and ignored otherwise.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Reads .gitleaks.toml from the repository root.
